name: NEX GEF Bootstrap Smoke

on:
  pull_request:
    paths:
      - '.engineering/**'
      - '.gef/**'
      - '.github/workflows/gef-bootstrap-smoke.yml'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/gef-*.mjs'
  push:
    branches: [main]
    paths:
      - '.engineering/**'
      - '.gef/**'
      - '.github/workflows/gef-bootstrap-smoke.yml'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/gef-*.mjs'

permissions:
  contents: read

jobs:
  gef-smoke:
    name: GEF smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run GEF read-only and collision smoke tests
        run: npm run test:gef
      - name: Check dependency advisories
        run: npm audit --audit-level=high
