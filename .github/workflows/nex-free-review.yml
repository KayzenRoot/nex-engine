name: NEX Free Security Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nex-free-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-review:
    name: NEX Free Review / Static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned free and local Semgrep CE
        run: python -m pip install --disable-pip-version-check semgrep==1.180.0
      - name: Parse and run local security rules, fail closed
        run: |
          semgrep scan --config=.semgrep/nex-security.yml --error --severity=ERROR --metrics=off --disable-version-check --exclude=tests --exclude=.engineering .
      - name: Validate Python syntax and CI policy tests
        run: |
          python -m compileall -q scripts tooling tests
          python -m unittest discover -s tests/ci -p 'test_*.py' -v
